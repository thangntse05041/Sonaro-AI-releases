# Daily copy of the official MCP Registry for Settings → Connectors (the registry search takes
# 10–60 s; the app searches this file on the device). Lives in the public Sonaro-AI-releases repo
# as .github/workflows/registry-snapshot.yml; its source is docs/releases-repo/ of the app repo.
# No artifacts and no cache (Actions storage stays empty); the file goes to the registry-data
# branch as one commit, replaced only when the registry changed, so the repo does not grow.
name: Registry snapshot

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # A new version of this workflow or its script runs once right away.
  push:
    branches: [main]
    paths:
      - .github/workflows/registry-snapshot.yml
      - .github/scripts/registry-snapshot.mjs

permissions:
  contents: write

concurrency:
  group: registry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the registry
        run: node .github/scripts/registry-snapshot.mjs "$RUNNER_TEMP/connectors.json"
      - name: Publish when it changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/connectors.json"
          if git fetch --depth 1 origin registry-data 2>/dev/null \
            && git show FETCH_HEAD:connectors.json > "$RUNNER_TEMP/old.json" \
            && cmp -s "$RUNNER_TEMP/old.json" "$new"; then
            echo "No change."
            exit 0
          fi
          dir="$(mktemp -d)"
          cp "$new" "$dir/connectors.json"
          cd "$dir"
          git init -q -b registry-data
          git add connectors.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'Registry snapshot'
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" registry-data
          echo "Published $(wc -c < connectors.json) bytes."
