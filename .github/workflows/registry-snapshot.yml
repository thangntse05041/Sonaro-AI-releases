# Daily copies for the app, published on the registry-data branch of the public
# Sonaro-AI-releases repo:
#   connectors.json — the official MCP Registry for Settings → Connectors (its search takes 10–60 s;
#                     the app searches this file on the device);
#   skills.json     — the skills.sh list for Settings → Skills → Discover (used when skills.sh does
#                     not answer).
# Lives in that repo as .github/workflows/registry-snapshot.yml; its source is docs/releases-repo/
# of the app repo. No artifacts and no cache (Actions storage stays empty); both files go to the
# branch as one commit, replaced only when one changed, so the repo does not grow. When one source
# fails, its previous file is kept.
name: Registry snapshot

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # A new version of this workflow or its script runs once right away.
  push:
    branches: [main]
    paths:
      - .github/workflows/registry-snapshot.yml
      - .github/scripts/registry-snapshot.mjs
      - .github/scripts/skills-snapshot.mjs

permissions:
  contents: write

concurrency:
  group: registry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Previous copies
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          if git fetch --depth 1 origin registry-data 2>/dev/null; then
            git show FETCH_HEAD:connectors.json > "$RUNNER_TEMP/old/connectors.json" 2>/dev/null || true
            git show FETCH_HEAD:skills.json > "$RUNNER_TEMP/old/skills.json" 2>/dev/null || true
          fi
      - name: Read the registry
        continue-on-error: true
        run: node .github/scripts/registry-snapshot.mjs "$RUNNER_TEMP/connectors.json"
      - name: Read skills.sh
        continue-on-error: true
        run: node .github/scripts/skills-snapshot.mjs "$RUNNER_TEMP/skills.json"
      - name: Publish when one changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          changed=0
          for f in connectors.json skills.json; do
            if [ -s "$RUNNER_TEMP/$f" ]; then
              cp "$RUNNER_TEMP/$f" "$dir/$f"
            elif [ -s "$RUNNER_TEMP/old/$f" ]; then
              echo "$f: source failed, the previous copy stays."
              cp "$RUNNER_TEMP/old/$f" "$dir/$f"
            else
              echo "$f: no copy yet."
              continue
            fi
            cmp -s "$dir/$f" "$RUNNER_TEMP/old/$f" 2>/dev/null || changed=1
          done
          if [ "$changed" = 0 ]; then
            echo "No change."
            exit 0
          fi
          cd "$dir"
          git init -q -b registry-data
          git add .
          git -c user.name='github-actions[bot]'             -c user.email='41898282+github-actions[bot]@users.noreply.github.com'             commit -q -m 'Registry and skills snapshot'
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" registry-data
          ls -l
