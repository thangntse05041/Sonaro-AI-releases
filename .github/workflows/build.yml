# Builds the installers of one version of the (private) app repo and publishes them on the
# release of the same tag in this public repo (thangntse05041/Sonaro-AI-releases): each platform
# as soon as its job is done; the first one creates the release.
# Lives in that repo as .github/workflows/build.yml; its source is docs/releases-repo/build.yml of
# the app repo, and `npm run release` updates it here when the source changed, then starts it.
# Why here: Actions minutes are free and unlimited for public repos (macOS counts x10 on private).
# The source is checked out with a read-only deploy key (secret SOURCE_DEPLOY_KEY). The logs of
# this repo are public: no step prints source code (tests run on the developer's machine before
# the release), and inputs reach the shell only through env, never through ${{ }} in `run`.
# Only the platforms that changed are built (input platforms); the files of the others are copied
# from the release that last built them (inputs carry_desktop, carry_android), so every release
# holds every installer and the fixed links releases/latest/download/… keep working.
# A failed or cancelled job is re-run alone (`gh run rerun --failed`, which `npm run release`
# does by itself). No Actions artifacts and no npm cache: Actions storage stays empty.
name: Build release
run-name: Build ${{ inputs.tag }} (${{ inputs.sha }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag of the app repo (for example v2.7.0)'
        required: true
      sha:
        description: 'Commit of the app repo the tag points at'
        required: true
      notes:
        description: 'Release notes (Markdown)'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      platforms:
        description: 'Jobs to build, comma-separated (windows,mac,android)'
        required: true
        default: 'windows,mac,android'
      carry_desktop:
        description: 'Release tag to copy the Windows and macOS files from (empty: built here)'
        required: false
        default: ''
      carry_android:
        description: 'Release tag to copy the APK from (empty: built here)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  SHA: ${{ inputs.sha }}
  SONARO_SOURCE_SHA: ${{ inputs.sha }}
  NOTES: ${{ inputs.notes }}
  PRERELEASE: ${{ inputs.prerelease }}
  PLATFORMS: ${{ inputs.platforms }}
  CARRY_DESKTOP: ${{ inputs.carry_desktop }}
  CARRY_ANDROID: ${{ inputs.carry_android }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # The app is not code signed (see CLAUDE.md 14, Phase 6).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Supabase project for sign-in and sync (publishable values; see docs/supabase-setup.md).
  MAIN_VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  # Creates the release of TAG when no job did yet (two jobs may try at once), then uploads
  # the files given as arguments. Run as: bash -c "$PUBLISH" publish <files…>
  # ${flags[@]+…}: the macOS runner has bash 3.2, where an empty array is "unbound" under set -u.
  PUBLISH: |
    set -euo pipefail
    node "$GITHUB_WORKSPACE/scripts/releaseAudit.mjs" publish "$@"
    printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
    flags=(); [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
    gh release view "$TAG" >/dev/null 2>&1 ||
      gh release create "$TAG" --title "Sonaro AI ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" ${flags[@]+"${flags[@]}"} ||
      gh release view "$TAG" >/dev/null
    gh release upload "$TAG" "$@" --clobber
  # Rejects inputs that are not a version tag and a full commit id.
  CHECK_INPUTS: |
    [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad tag"; exit 1; }
    [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }
    [[ "$PLATFORMS" =~ ^(windows|mac|android)(,(windows|mac|android))*$ ]] || { echo "Bad platforms"; exit 1; }
    for c in "$CARRY_DESKTOP" "$CARRY_ANDROID"; do
      [[ -z "$c" || "$c" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad carry tag"; exit 1; }
    done

jobs:
  windows:
    if: contains(format(',{0},', inputs.platforms), ',windows,')
    runs-on: windows-latest
    steps:
      - shell: bash
        run: bash -c "$CHECK_INPUTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thangntse05041/Sonaro-AI
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          # No npm cache: Actions storage stays empty.
          package-manager-cache: false
      # .npmrc sets ignore-scripts=true (better-sqlite3 ships prebuilt binaries).
      - run: node scripts/releaseBuild.mjs package windows --ci
      - name: Publish the installers
        shell: bash
        run: bash -c "$PUBLISH" publish dist/*.exe dist/*.blockmap dist/latest.yml dist/build-provenance-windows.json dist/secret-scan-windows.json

  mac:
    if: contains(format(',{0},', inputs.platforms), ',mac,')
    runs-on: macos-latest
    steps:
      - run: bash -c "$CHECK_INPUTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thangntse05041/Sonaro-AI
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          # No npm cache: Actions storage stays empty.
          package-manager-cache: false
      - run: node scripts/releaseBuild.mjs package mac --ci
      - name: Publish the installers
        run: bash -c "$PUBLISH" publish dist/*.dmg dist/*.blockmap dist/latest-mac.yml dist/build-provenance-mac.json dist/secret-scan-mac.json

  android:
    if: contains(format(',{0},', inputs.platforms), ',android,')
    runs-on: ubuntu-24.04
    steps:
      - run: bash -c "$CHECK_INPUTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thangntse05041/Sonaro-AI
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          # No npm cache: Actions storage stays empty.
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      # The signing keystore is kept in this repo's secrets (see CLAUDE.md 13).
      - name: Restore the signing keystore
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonaro-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # A download failing on Google's side (502) should not fail the release: try up to 3 times.
      - name: Build the APK
        run: |
          chmod +x android/gradlew
          for attempt in 1 2 3; do
            node scripts/releaseBuild.mjs package android --ci && exit 0
            echo "Android build failed (attempt $attempt), retrying in 60 s"
            sleep 60
          done
          exit 1
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sonaro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Publish the APK
        run: bash -c "$PUBLISH" publish dist/Sonaro-AI.apk dist/build-provenance-android.json dist/secret-scan-android.json

  # The platforms not built this time: their files from the release that last built them.
  carry:
    if: inputs.carry_desktop != '' || inputs.carry_android != ''
    runs-on: ubuntu-24.04
    steps:
      - run: bash -c "$CHECK_INPUTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: thangntse05041/Sonaro-AI
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Copy the files of the platforms not built
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/carry"
          cd "$RUNNER_TEMP/carry"
          if [ -n "$CARRY_DESKTOP" ]; then
            gh release download "$CARRY_DESKTOP" -p '*.exe' -p '*.dmg' -p '*.blockmap' -p 'latest.yml' -p 'latest-mac.yml'
          fi
          if [ -n "$CARRY_ANDROID" ]; then
            gh release download "$CARRY_ANDROID" -p 'Sonaro-AI.apk'
          fi
          # Carry original build provenance, never relabel old files as newly built.
          carry_provenance() {
            local tag="$1" platform="$2" name assets
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for name in "build-provenance-$platform.json" "secret-scan-$platform.json"; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$name"; then
                echo "Rebuild $platform: $tag has no current release audit."
                exit 1
              fi
              gh release download "$tag" -p "$name"
            done
          }
          if [ -n "$CARRY_DESKTOP" ]; then
            carry_provenance "$CARRY_DESKTOP" windows
            carry_provenance "$CARRY_DESKTOP" mac
          fi
          if [ -n "$CARRY_ANDROID" ]; then
            carry_provenance "$CARRY_ANDROID" android
          fi
          bash -c "$PUBLISH" publish ./*
